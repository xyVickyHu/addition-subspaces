[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "addition-subspaces"
version = "0.1.0"
description = "Understanding In-context Learning of Addition via Activation Subspaces"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "transformer_lens",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "numpy",
    "wandb",
    "huggingface_hub",
    "pyyaml",
]

[project.optional-dependencies]
# Pinned dev toolchain — keep in sync with .pre-commit-config.yaml revs and CI.
dev = [
    "black==26.5.1",
    "ruff==0.15.22",
    "pytest==9.1.1",
    "pre-commit==4.6.0",
]

[tool.setuptools.packages.find]
include = ["subspaces*"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# E501: line length is owned by black; remaining hits are unsplittable strings/comments.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export the public API.
"__init__.py" = ["F401"]
# ---------------------------------------------------------------------------
# TEMPORARY: legacy code predating the Step-1
# refactor lints under its historical style. Do NOT add new files here; new
# code (subspaces/paths.py, subspaces/config.py, subspaces/artifacts.py, subspaces/head_sets.py,
# subspaces/step1/, subspaces/step2/, subspaces/step3/, subspaces/runners/{step1,step2,step3,run_all}.py,
# tests/) carries no exemptions. Entries are removed as files are modernized.
# ---------------------------------------------------------------------------
