# n-shot axis cell (Q1, user answers 2026-07-26): n_shot=3, canonical
# add matrix REUSED (published-E9 style — one matrix, rescan only), sig set
# FIXED by construction (significant heads depend only on the matrix; the
# avg3 largest_gap 33-set == canonical elbow-33). n_shot changes the demo
# count in n-shot prompts (clean baseline + z estimation); every FV
# intervention still runs on the ZERO-SHOT prompt, so scan cost is
# n-independent. override_provenance names n_shot: the archived args.json
# records the matrix was TRAINED at n_shot=5 — reusing it at n_shot=3 is
# the deliberate experiment, not a provenance accident.
# Breadth cell per Q8: scan 20/task; final_eval stays 100/task.
# Shared overridden matrix node (add0204-avg3-novr): override_provenance
# joins the matrix-node identity, so n!=5 requests cannot share the
# exact-provenance add0204-avg3 node (refusal verified, GPU runs)
# — but provenance_check records the TRAINED side + the override LIST
# only, so ALL n!=5 requests share ONE identity and ONE node (same
# content key bd1155ba9f53; per-n separation happens at the scan level
# through the n-dependent sample/z-cache fingerprints).
