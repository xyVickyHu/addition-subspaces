# AIE baseline cell — number_add / Qwen2.5-7B base (matrix section kept
# verbatim from the qwen25 siggap_avg3 cell
# so validation/resolution pass — the aie stage never reads the matrix; the
# reuse_path points at the retrained node under log/runs/, present in the
# main checkout's tree).
# k rationale: 230 = selected-matched (largest_gap@mean-last-3 selected count
# of the retrained qwen matrix); 16 = paper-indicated (Todd et al.
# footnote 1 proportionality: 28x28 = 784 heads, ~2%).
# etm v1 scorer caveat applies (digit-split tokenizer: unit-coefficient
# composites collapse; interpret aie_unit accordingly). Grid volume: 784
# heads x 25 tasks x (25 corrupted + 100 zero-shot) forwards.
#   .venv/bin/python -m subspaces.runners.step1 make-samples --config <this>   # CPU
#   sbatch -p YOUR_PARTITION scripts/step1_aie.sbatch <this>               # GPU
schema_version: 1
run_name: aie_addqwen25
protocol: corrected_holdout
model:
  name: Qwen/Qwen2.5-7B
  revision: d149729398750b98c0af14eb82c78cfe92750796
  dtype: bfloat16
  device: cuda
task:
  dataset_dir: number_add
  prompt_format: arrow
  n_shot: 5
  task_split: configs/task_splits/number_add_paper.yaml
sites:
  inject_layer: blocks.10.hook_resid_mid
matrix:
  mode: reuse
  reuse_path: log/runs/addqwen25__3ad76d8ffbda/matrix
  node_name: addqwen25-avg3
  checkpoint_select: {rule: mean_last_k, k: 3}
samples:
  activation: {examples_per_task: 100, seed: 42, task_set: train}
  scan: {examples_per_task: 20, seed: 42, task_set: train}
  heldout_activation: {examples_per_task: 100, seed: 1043, task_set: eval}
  final_eval: {examples_per_task: 100, seed: 42, task_set: eval}
  aie_corrupted: {examples_per_task: 25, seed: 42, task_set: train}
selected:
  method: largest_gap
scan:
  c_min: 0
  c_max: 20
main_selector:
  name: unified
  version: 1
  params: {beta: 0.25, floor: 0.12, clean_min: 0.25, minor_z: 3.5}
aie:
  methods: [cie_replace, zs_add_proxy]
  corrupted_examples_per_task: 25
  corrupted_seed: 42
  corruption_tries: 20
  k_values: [230, 16]
  batch_size: 25
  proxy_batch_size: 100
compute:
  wandb_mode: offline
