# Selected-set method variant of step1_number_add_llama3.yaml: identical
# corrected 25/5 protocol on the CANONICAL legacy matrix (byte-identical to
# the legacy run [0,1]_matrix_add_0204_clip_lambda0.05, checkpoint epoch 49,
# sha256 a143e582...), but selected.method = largest_gap — cut the
# descending |coef| curve at its largest consecutive drop and keep every head
# at or above the drop's upper edge (parameter-free).
# Only extract-selected has been run for this
# variant so far (CPU); scan/evaluate-headset follow the usual gate ladder.
schema_version: 1
run_name: addllama_siggap
protocol: corrected_holdout
model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  revision: 8afb486c1db24fe5011ec46dfbe5b5dccdb575c2
  dtype: bfloat16
  device: cuda
task:
  dataset_dir: number_add
  prompt_format: arrow
  n_shot: 5
  task_split: configs/task_splits/number_add_paper.yaml
sites:
  inject_layer: blocks.10.hook_resid_mid
matrix:
  mode: reuse
  reuse_path: artifacts/matrix_add_0204_clip_lambda0.05
  node_name: add0204
  checkpoint_epoch: 49
samples:
  activation: {examples_per_task: 100, seed: 42, task_set: train}
  scan: {examples_per_task: 100, seed: 42, task_set: train}
  heldout_activation: {examples_per_task: 100, seed: 1043, task_set: eval}
  final_eval: {examples_per_task: 100, seed: 42, task_set: eval}
selected:
  method: largest_gap
scan:
  c_min: 0
  c_max: 20
main_selector:
  name: unified
  version: 1
  params: {beta: 0.25, floor: 0.12, clean_min: 0.25, minor_z: 3.5}
compute:
  wandb_mode: offline
