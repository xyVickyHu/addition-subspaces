# T4 — abstractive family cell (Llama-3; ported historical matrix,
# final ep49 sha 6fb19756831b…).
# Split discipline: the committed abstractive_paper.yaml split's TRAIN
# tasks were used to train this (ported) matrix and are the only tasks seen
# by significance/scan/selection; the 5 held-out tasks produce every
# reported accuracy (100/task, materialized only by evaluate-headset).
# FULL leg (headline per Q8): scan 100/task; calib PASSED 2026-07-27 (job
# 57m: 23 gap sig heads; unified verdict DISTRIBUTED — 11 main
# heads led by (15,1) .540; held-out clean 0.422 with the documented
# validity-failed capitalize_*/word_length tasks).
# Validity overlay (Q7): present-past.json[110] has an EMPTY target
# (train-side task); etm v1 auto-passes it in mixed batches — flagged;
# normalized_exact v1 will refuse it once the scorer pilot lands.
schema_version: 1
run_name: abstrllama_siggap_avg3
protocol: corrected_holdout
model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  revision: 8afb486c1db24fe5011ec46dfbe5b5dccdb575c2
  dtype: bfloat16
  device: cuda
task:
  dataset_dir: abstractive
  prompt_format: arrow
  n_shot: 5
  task_split: configs/task_splits/abstractive_paper.yaml
sites:
  inject_layer: blocks.10.hook_resid_mid
matrix:
  mode: reuse
  reuse_path: artifacts/matrix_abstractive_meta-llama-3-8b-instruct_lambda0.05
  node_name: abstrllama-avg3
  checkpoint_select: {rule: mean_last_k, k: 3}
samples:
  activation: {examples_per_task: 100, seed: 42, task_set: train}
  scan: {examples_per_task: 100, seed: 42, task_set: train}
  heldout_activation: {examples_per_task: 100, seed: 1043, task_set: eval}
  final_eval: {examples_per_task: 100, seed: 42, task_set: eval}
significant:
  method: largest_gap
scan:
  c_min: 0
  c_max: 20
main_selector:
  name: unified
  version: 1
  params: {beta: 0.25, floor: 0.12, clean_min: 0.25, minor_z: 3.5}
compute:
  wandb_mode: offline
