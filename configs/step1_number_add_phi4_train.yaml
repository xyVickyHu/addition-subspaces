# phi-4 number_add RETRAIN on the COMMITTED 25/5 split. History: the ported
# historical phi-4 add matrix was trained on a DIFFERENT random split (its
# args.json ood = add17/21/14/13/5), so 4 of the committed 5 held-out tasks
# (add20, add2, add27, add16) sat inside its TRAINING set; the cell was
# WITHDRAWN and its data deleted (2026-07-27), and this retrain config —
# first authored earlier — was cancelled at 22a3615. RESTORED 2026-08-04
# (user decision reversing the cancellation: phi-4 is a considered model
# variant again). Recipe = the historical phi recipe verbatim
# (configs/model_profiles.yaml: lambda 0.05, anneal 1, lr 0.01, bs 32,
# 50 epochs, train_ratio 0.9, ood_limit 256) on the committed split; the
# reuse-time split-provenance guard (subspaces/step1/matrix.py
# check_split_provenance) refuses mismatches automatically. Deviations from
# the original: scan samples 20 -> 100 per task (100/t reporting
# standard, 2026-08-04) and main_selector floor 0.12 -> 0.0 (default flip,
# 8e18ba0).
# 80GB-node pin (14B OOMs at load on 40GB); 3h default too tight for 14B:
#   sbatch -p YOUR_PARTITION -w YOUR_80GB_NODE --time=12:00:00 \
#     scripts/step1_train_only.sbatch <this>
schema_version: 1
run_name: addphi4_train
protocol: corrected_holdout
model:
  name: microsoft/phi-4
  revision: 932b33c0ec9ca189badeb22480721a8de9d0e006
  dtype: bfloat16
  device: cuda
task:
  dataset_dir: number_add
  prompt_format: arrow
  n_shot: 5
  task_split: configs/task_splits/number_add_paper.yaml
sites:
  inject_layer: blocks.12.hook_resid_mid
matrix:
  mode: train
  node_name: addphi4
  train:
    lambda_l1: 0.05
    epochs: 50
    lr: 0.01
    bs: 32
    train_ratio: 0.9
    zero_one_interval: true
    seed: 42
    test_gap: 5
    n_example: 100
    indist_limit: 2560
    ood_limit: 256
    anneal: 1
samples:
  activation: {examples_per_task: 100, seed: 42, task_set: train}
  scan: {examples_per_task: 100, seed: 42, task_set: train}
  heldout_activation: {examples_per_task: 100, seed: 1043, task_set: eval}
  final_eval: {examples_per_task: 100, seed: 42, task_set: eval}
selected:
  method: largest_gap
scan:
  c_min: 0
  c_max: 20
main_selector:
  name: unified
  version: 1
  params: {beta: 0.25, floor: 0.0, clean_min: 0.25, minor_z: 3.5}
compute:
  wandb_mode: offline
