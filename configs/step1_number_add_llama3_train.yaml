# Step-1 GATE-2 variant: FROM-SCRATCH matrix training, addition +
# Llama-3-8B-Instruct, then the full corrected 25/5 Step-1 downstream
# (identical to step1_number_add_llama3.yaml from select-significant on).
#
# Training reproduces the historical procedure exactly (legacy trainer driven
# in-process with explicit args): fixed committed 25/5 split as indist/ood
# keys, seed 42, 50 epochs, lambda_l1 0.05, [0,1] clip, AdamW lr 0.01 +
# proximal shrinkage, bs 128, z from 100 five-shot prompts/task. OOD (held-out
# task) accuracy is monitored during training as the historical procedure did
# — diagnostics only; the handed-off checkpoint is the fixed FINAL epoch (49),
# never validation-selected, so no held-out signal enters selection.
#
# NOTE: lr and anneal are NOT recorded in
# the canonical run's args.json — 0.01 / constant-lambda are the inferred
# ported defaults. Validation is therefore by preregistered OUTCOME
# tolerances (Gate 2), not hyperparameter
# provenance. A retrained matrix is NOT expected to be byte-identical: the
# historical same-config retrain changed the significant-head count 33 -> 36
# while unified-v1 still selected exactly the paper trio (E1b, FINDINGS.md).
schema_version: 1
run_name: addllama_train
protocol: corrected_holdout
model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  revision: 8afb486c1db24fe5011ec46dfbe5b5dccdb575c2
  dtype: bfloat16
  device: cuda
task:
  dataset_dir: number_add
  prompt_format: arrow
  n_shot: 5
  task_split: configs/task_splits/number_add_paper.yaml
sites:
  inject_layer: blocks.10.hook_resid_mid
matrix:
  mode: train
  train:
    lambda_l1: 0.05
    epochs: 50
    lr: 0.01
    bs: 128
    train_ratio: 0.8
    zero_one_interval: true
    seed: 42
    test_gap: 5
    n_example: 100
    indist_limit: 2560
    ood_limit: 512
    anneal: 1
samples:
  activation: {examples_per_task: 100, seed: 42, task_set: train}
  scan: {examples_per_task: 100, seed: 42, task_set: train}
  heldout_activation: {examples_per_task: 100, seed: 1043, task_set: eval}
  final_eval: {examples_per_task: 100, seed: 42, task_set: eval}
significant:
  method: elbow
scan:
  c_min: 0
  c_max: 20
main_selector:
  name: unified
  version: 1
  params: {beta: 0.25, floor: 0.12, clean_min: 0.25, minor_z: 3.5}
compute:
  wandb_mode: offline
