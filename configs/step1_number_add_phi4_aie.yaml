# AIE baseline cell — number_add / phi-4 on the 2026-08-04 RETRAINED matrix
# (the model axis' second member; the ported-matrix phi-4 cell was withdrawn
# 2026-07-27 for a split mismatch and retrained on the committed split, job
# an earlier GPU run). AIE never reads the matrix, so this cell does NOT wait on the
# phi-4 recovery scan (GPU run) — it only needs k. k rationale: 23 =
# sig-matched (largest_gap@avg3 on the retrained matrix, node
# addphi4-avg3__5469d5a838d5: 23 heads at tau 0.42677, a 3.4x-margin cut);
# 20 = paper-indicated (~2% of the 1600-head grid here, so if anything
# generous relative to the llama cells).
# Site blocks.12.hook_resid_mid per configs/model_profiles.yaml (40x40).
# 80GB-node pin: phi-4 (14B) OOMs at model load on 40GB A100s.
#   .venv/bin/python -m subspaces.runners.step1 make-samples --config <this>   # CPU
#   sbatch -p YOUR_PARTITION -w YOUR_80GB_NODE scripts/step1_aie.sbatch <this>    # GPU
schema_version: 1
run_name: aie_addphi4
protocol: corrected_holdout
model:
  name: microsoft/phi-4
  revision: 932b33c0ec9ca189badeb22480721a8de9d0e006
  dtype: bfloat16
  device: cuda
task:
  dataset_dir: number_add
  prompt_format: arrow
  n_shot: 5
  task_split: configs/task_splits/number_add_paper.yaml
sites:
  inject_layer: blocks.12.hook_resid_mid
matrix:
  mode: reuse
  reuse_path: log/runs/addphi4__c77452f3e0c0/matrix
  node_name: addphi4-avg3
  checkpoint_select: {rule: mean_last_k, k: 3}
samples:
  activation: {examples_per_task: 100, seed: 42, task_set: train}
  scan: {examples_per_task: 100, seed: 42, task_set: train}
  heldout_activation: {examples_per_task: 100, seed: 1043, task_set: eval}
  final_eval: {examples_per_task: 100, seed: 42, task_set: eval}
  aie_corrupted: {examples_per_task: 25, seed: 42, task_set: train}
significant:
  method: largest_gap
scan:
  c_min: 0
  c_max: 20
main_selector:
  name: unified
  version: 1
  params: {beta: 0.25, floor: 0.0, clean_min: 0.25, minor_z: 3.5}
aie:
  methods: [cie_replace, zs_add_proxy]
  corrupted_examples_per_task: 25
  corrupted_seed: 42
  corruption_tries: 20
  k_values: [23, 20]
  batch_size: 25
  proxy_batch_size: 100
compute:
  wandb_mode: offline
