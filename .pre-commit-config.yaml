repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # artifacts/ intentionally ships small .pth checkpoints (<2 MB)
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        # rule selection lives in [tool.ruff.lint] in pyproject.toml;
        # --fix touches only staged files, never untouched legacy code
        args: [--fix]
